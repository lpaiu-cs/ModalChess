# Elo A/B 교차 평가: 하나의 checkpoint를 D1-val과 r1800-val 양쪽에서 평가
# (test split은 공식 게이트용으로 보존, A/B 판정은 val만 사용)
output_dir: outputs/scale_v1/ab_eval
datasets:
  d1_val:
    source: jsonl
    dataset_path: data/pilot/real_v2_scale/supervised_val.jsonl
    split: all
    history_length: 1
    loading: lazy
    validate_sample_rate: 0.0
  r1800_val:
    source: jsonl
    dataset_path: data/pilot/real_v2_scale_r1800/supervised_val.jsonl
    split: all
    history_length: 1
    loading: lazy
    validate_sample_rate: 0.0
model: {}
metrics:
  topk: [1, 3, 5]
  batch_size: 1024
